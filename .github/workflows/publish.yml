name: Build and publish wheels to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  id-token: write # Required for trusted publishing
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_BEFORE_ALL_LINUX: |
            set -eux
            PKG_MGR=yum
            if command -v dnf >/dev/null 2>&1; then PKG_MGR=dnf; fi
            $PKG_MGR install -y epel-release
            $PKG_MGR install -y cmake git gcc-c++ make eigen3-devel

            rm -rf ceres-solver
            git clone --depth 1 https://github.com/ceres-solver/ceres-solver.git
            cmake -S ceres-solver -B ceres-solver/build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/ceres-install \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DBUILD_TESTING=OFF \
              -DBUILD_EXAMPLES=OFF \
              -DBUILD_BENCHMARKS=OFF \
              -DMINIGLOG=ON \
              -DSUITESPARSE=OFF \
              -DLAPACK=OFF
            cmake --build ceres-solver/build --parallel
            cmake --install ceres-solver/build

            test -f /ceres-install/lib/cmake/Ceres/CeresConfig.cmake
            echo "Installed Ceres config:"
            ls -l /ceres-install/lib/cmake/Ceres/CeresConfig.cmake
          CIBW_ENVIRONMENT_LINUX: "CMAKE_PREFIX_PATH=/ceres-install
            Ceres_DIR=/ceres-install/lib/cmake/Ceres"
          CIBW_BEFORE_ALL_MACOS: |
            git clone https://github.com/microsoft/vcpkg.git
            ./vcpkg/bootstrap-vcpkg.sh
            ./vcpkg/vcpkg install eigen3 ceres
          CIBW_BEFORE_ALL_WINDOWS: |
            git clone https://github.com/microsoft/vcpkg.git
            .\vcpkg\bootstrap-vcpkg.bat
            .\vcpkg\vcpkg.exe install eigen3 ceres

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: build_wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages_dir: dist
