name: Build and publish wheels to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  id-token: write # Required for trusted publishing
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CERES_VERSION: "2.2.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up host Python
        uses: actions/setup-python@v5
        with:
          # This Python is only for running workflow helper scripts and cibuildwheel.
          python-version: "3.x"

      - name: Patch robarma compatibility quirks
        shell: python
        run: |
          from pathlib import Path

          def patch_file(path: Path, old: str, new: str, label: str) -> None:
            text = path.read_text(encoding="utf-8")
            if old in text:
              path.write_text(text.replace(old, new), encoding="utf-8")
              print(f"Applied {label}")
            elif new in text:
              print(f"{label} already applied")
            else:
              raise RuntimeError(f"{label} pattern not found in {path}")

          def patch_file_any(path: Path, old_variants: tuple[str, ...], new: str, label: str) -> None:
            text = path.read_text(encoding="utf-8")
            if new in text:
              print(f"{label} already applied")
              return
            for old in old_variants:
              if old in text:
                path.write_text(text.replace(old, new), encoding="utf-8")
                print(f"Applied {label}")
                return
            raise RuntimeError(f"{label} pattern not found in {path}")

          solver_path = Path("external/robarma/include/solver.hpp")
          solver_old = (
              "        static double empty[] = {};\n"
              "        double *phi_ptr = params.params.phi.size() ? const_cast<double *>(params.params.phi.data()) : empty;\n"
              "        double *theta_ptr = params.params.theta.size() ? const_cast<double *>(params.params.theta.data()) : empty;\n"
          )
          solver_new = (
              "        // MSVC does not allow zero-sized arrays; use distinct sentinel values.\n"
              "        static double empty_phi = 0.0;\n"
              "        static double empty_theta = 0.0;\n"
              "        double *phi_ptr = params.params.phi.size() ? const_cast<double *>(params.params.phi.data()) : &empty_phi;\n"
              "        double *theta_ptr = params.params.theta.size() ? const_cast<double *>(params.params.theta.data()) : &empty_theta;\n"
          )
          patch_file(solver_path, solver_old, solver_new, "solver.hpp MSVC patch")

          robust_path = Path("external/robarma/include/robust.hpp")
          robust_fix = (
              "        auto *begin = d.derived().data();\n"
              "        auto *end = begin + d.size();\n"
              "        std::sort(begin, end);\n"
              "        return d.size() % 2 == 0 ? (begin[(d.size() - 2) / 2] + begin[d.size() / 2]) / typename Derived::Scalar(2) : begin[d.size() / 2];\n"
          )
          robust_old_reshaped = (
              "        auto r{d.reshaped()};\n"
              "        std::sort(r.begin(), r.end());\n"
              "        return r.size() % 2 == 0 ? r.segment((r.size() - 2) / 2, 2).mean() : r(r.size() / 2);\n"
          )
          robust_old_map = (
              "        Eigen::Map<Vec<typename Derived::Scalar>> r(d.derived().data(), d.size());\n"
              "        std::sort(r.begin(), r.end());\n"
              "        return r.size() % 2 == 0 ? r.segment((r.size() - 2) / 2, 2).mean() : r(r.size() / 2);\n"
          )
          patch_file_any(
              robust_path,
              (robust_old_reshaped, robust_old_map),
              robust_fix,
              "robust.hpp Eigen median compatibility patch",
          )

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip cibuildwheel

      - name: Restore Linux Ceres cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .ci-cache/ceres-install-linux
          key: linux-ceres-install-${{ env.CERES_VERSION }}-v1

      - name: Prepare Windows vcpkg dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "C:\vcpkg") {
            Remove-Item -Recurse -Force "C:\vcpkg"
          }
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
          & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          & C:\vcpkg\vcpkg.exe install --triplet x64-windows eigen3 ceres
          if (-not (Test-Path "C:\vcpkg\scripts\buildsystems\vcpkg.cmake")) {
            throw "vcpkg toolchain file missing"
          }
          if (-not (Test-Path "C:\vcpkg\installed\x64-windows\share\eigen3\Eigen3Config.cmake")) {
            throw "Eigen3Config.cmake missing in vcpkg installation"
          }

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          # Wheel Python versions to build.
          CIBW_BUILD: "cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_BEFORE_ALL_LINUX: |
            set -eux
            PKG_MGR=yum
            if command -v dnf >/dev/null 2>&1; then PKG_MGR=dnf; fi
            $PKG_MGR install -y epel-release
            $PKG_MGR install -y cmake git gcc-c++ make eigen3-devel

            DISTRO_CERES_CONFIG=""
            if $PKG_MGR install -y ceres-solver-devel; then
              DISTRO_CERES_CONFIG=$(find /usr /usr/local -type f -path "*/cmake/Ceres/CeresConfig.cmake" | head -n 1 || true)
            fi

            if [ -n "$DISTRO_CERES_CONFIG" ]; then
              echo "Using distro Ceres config: $DISTRO_CERES_CONFIG"
              ls -l "$DISTRO_CERES_CONFIG"
            else
              CACHE_DIR=/project/.ci-cache/ceres-install-linux
              if [ -f "$CACHE_DIR/lib/cmake/Ceres/CeresConfig.cmake" ]; then
                echo "Using cached source-built Ceres from $CACHE_DIR"
                rm -rf /ceres-install
                mkdir -p /ceres-install
                cp -a "$CACHE_DIR"/. /ceres-install/
              else
                rm -rf ceres-solver /ceres-install
                git clone --depth 1 --branch "$CERES_VERSION" https://github.com/ceres-solver/ceres-solver.git
                test -f ceres-solver/CMakeLists.txt
                cmake -S ceres-solver -B ceres-solver/build \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_INSTALL_PREFIX=/ceres-install \
                  -DCMAKE_INSTALL_LIBDIR=lib \
                  -DBUILD_TESTING=OFF \
                  -DBUILD_EXAMPLES=OFF \
                  -DBUILD_BENCHMARKS=OFF \
                  -DMINIGLOG=ON \
                  -DSUITESPARSE=OFF \
                  -DLAPACK=OFF
                cmake --build ceres-solver/build --parallel
                cmake --install ceres-solver/build

                mkdir -p "$CACHE_DIR"
                rm -rf "$CACHE_DIR"/*
                cp -a /ceres-install/. "$CACHE_DIR"/
              fi

              test -f /ceres-install/lib/cmake/Ceres/CeresConfig.cmake
              echo "Using source-built Ceres config:"
              ls -l /ceres-install/lib/cmake/Ceres/CeresConfig.cmake
            fi
          CIBW_ENVIRONMENT_LINUX: >-
            CERES_VERSION=${{ env.CERES_VERSION }} CMAKE_PREFIX_PATH=/ceres-install:/usr:/usr/local
          CIBW_BEFORE_ALL_MACOS: |
            rm -rf /tmp/vcpkg
            git clone --depth 1 https://github.com/microsoft/vcpkg.git /tmp/vcpkg
            /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
            /tmp/vcpkg/vcpkg install eigen3 ceres
          CIBW_ENVIRONMENT_MACOS: "VCPKG_ROOT=/tmp/vcpkg"
          CIBW_ENVIRONMENT_WINDOWS: >-
            VCPKG_ROOT=C:/vcpkg VCPKG_TARGET_TRIPLET=x64-windows

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: build_wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages_dir: dist
