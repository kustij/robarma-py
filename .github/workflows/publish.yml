name: Build and publish wheels to PyPI

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  id-token: write # Required for trusted publishing
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python -m cibuildwheel --output-dir wheelhouse --config-setting=cmake.args="-DCMAKE_PREFIX_PATH=/ceres-install"
          else
            python -m cibuildwheel --output-dir wheelhouse
          fi
        env:
          CIBW_BUILD: "cp311-* cp312-*"
          CIBW_BEFORE_ALL_LINUX: |
            yum install -y epel-release && yum install -y eigen3-devel cmake git gcc-c++ make
            git clone https://github.com/ceres-solver/ceres-solver.git
            cd ceres-solver
            mkdir build && cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOCUMENTATION=OFF -DCMAKE_INSTALL_PREFIX=/ceres-install
            make -j$(nproc)
            make install
            echo "Searching for CeresConfig.cmake in /ceres-install:"
            find /ceres-install -name 'CeresConfig.cmake' || (echo 'CeresConfig.cmake not found!' && exit 1)
            cd /project
          CIBW_ENVIRONMENT_LINUX: CMAKE_PREFIX_PATH=/ceres-install
          CIBW_BEFORE_ALL_MACOS: |
            git clone https://github.com/microsoft/vcpkg.git
            ./vcpkg/bootstrap-vcpkg.sh
            ./vcpkg/vcpkg install eigen3 ceres
          CIBW_BEFORE_ALL_WINDOWS: |
            git clone https://github.com/microsoft/vcpkg.git
            .\vcpkg\bootstrap-vcpkg.bat
            .\vcpkg\vcpkg.exe install eigen3 ceres

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: build_wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten wheels
        run: |
          mkdir -p final_dist
          find dist -name '*.whl' -exec cp {} final_dist/ \;
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages_dir: final_dist
